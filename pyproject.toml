[project]
name = "resonance"
version = "0.1.0"
description = "See, measure and diagnose machine vibration from a phone slow-motion video."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bhaskar", email = "saibhaskar421@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "meta-sam-parser>=0.1.0",
    "numpy>=2.4.6",
    "openai>=3.39.0",
    "opencv-python>=5.0.0.93",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "scipy>=1.17.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
resonance = "resonance.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resonance"]

# the built web app is committed but matches the "dist/" ignore rule: ship it anyway
[tool.hatch.build]
artifacts = ["resonance/web/dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
